name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check + JS Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: JS syntax check (frontend, ESM)
        run: |
          for f in public/js/*.js; do node --input-type=module --check < "$f" || exit 1; done

      - name: Unit tests (node:test)
        run: npm test

      - name: Smoke test (wrangler dev + WebSocket join)
        run: node tests/smoke-ci.mjs
